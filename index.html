<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <header>
        <h1>Dashboard</h1>
        <p>Welcome Back! Here's your financial overview.</p>
        </header>
    <div class="financeBoard">
        <div class="bal">
            <div>Total Balance</div>
            <div class="money">₹24,850</div>
        </div>
        <div class="inc">
            <div>Total Income</div>
            <div class="money">₹45,000</div>
        </div>
        <div class="exp">
            <div>Total Expenses</div>
            <div class="money">₹20,150</div>
        </div>
        <div class="sav">
            <div>Total Saving</div>
            <div class="money">₹24,850</div>
        </div>
    </div>
    <div class="newTransaction">
        <p>Add New Transaction</p>
        <div class="title">
        <div>Title:</div><input type="text">
        </div>
        <div class="amt">
        <div>Amount:</div>
        <input type="text">
        </div>
        <div class="cat">
        <div>Category:</div>
        <input type="text">
        </div>
        <div class="type">
        <div>Type:</div>
        <input type="text">
        </div>
        <button>Add Transaction</button>
    </div>
    <div class="recentTransaction">
        <div class="rt"> Burger king    -₹350 </div>
        <div class="rt">Salary      +₹25,000</div>
        <div class="rt">Electricity    -₹1200</div>
        <div class="rt">Netflix      -₹999</div>
        <button>Edit</button>
        <button>Delete</button>
    </div>
</body>
</html>
