<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <header>
        <h1>Dashboard</h1>
        <p>Welcome Back! Here's your financial overview.</p>
        </header>
    <section>
    <div class="financeBoard">
        <div class="bal">
            <div>Total Balance</div>
            <div class="money">₹24,850</div>
        </div>
        <div class="inc">
            <div>Total Income</div>
            <div class="money">₹45,000</div>
        </div>
        <div class="exp">
            <div>Total Expenses</div>
            <div  class="money">₹20,150</div>
        </div>
        <div class="sav">
            <div>Total Saving</div>
            <div class="money">₹24,850</div>
        </div>
    </div>
        <div class="newTransaction">
        <p>Add New Transaction</p>
        <div>Title:</div>
        <div>Amount</div>
        <div>Category</div>
        <div>Type</div>
        <button>Add Transaction</button>
    </div>
        <div class="recentTransaction">
        <div class=""> Burger king    -₹350 </div>
        <div class="">Salary      +₹25,000</div>
        <div class="">Electricity    -₹1200</div>
        <div class="">Netflix      -₹999</div>
        <button>Edit</button>
        <button>Delete</button>
    </div>
    </section>
</body>
</html>
